apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-workers
  namespace: n8n-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: n8n-workers
  template:
    metadata:
      labels:
        app: n8n-workers
    spec:
      nodeSelector:
        workload: apps
      dnsConfig:
        options:
        - name: ndots
          value: "1"
        - name: single-request-reopen
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:latest
        command: ["n8n", "worker"]
        envFrom:
        - configMapRef:
            name: n8n-config
        - secretRef:
            name: n8n-secret
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: n8n-workers-hpa
  namespace: n8n-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n-workers
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
