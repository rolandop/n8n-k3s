apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-gateway
  namespace: gateway-dmz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-gateway
  template:
    metadata:
      labels:
        app: ms-gateway
    spec:
      containers:
      - name: gateway
        image: nginx:alpine # REEMPLAZAR por la imagen real de ms-gateway
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ms-gateway
  namespace: gateway-dmz
spec:
  selector:
    app: ms-gateway
  ports:
  - port: 8080
    targetPort: 8080
